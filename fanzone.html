<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="XUSK2.0 Fan Zone - Eventos, concentraciones y motociclismo">

    <title>XUSK2.0 - FAN ZONE</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: #f3f3f8;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ENCABEZADO */

        header {
            background-color: #111;
            padding: 18px 30px;
            border-bottom: 2px solid #f6d32d;
            min-height: 15px;
        }

        /* CONTENIDO PRINCIPAL */

        main {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 35px 0;
            flex: 1;
        }

        h1 {
            color: #f6d32d;
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        h2 {
            color: #00008b;
            text-align: center;
            font-size: 28px;
            margin-bottom: 30px;
        }

        h3 {
            color: #f3f3f8;
            text-align: center;
            font-size: 18px;
            font-weight: normal;
            line-height: 1.7;
            max-width: 850px;
            margin: 0 auto 35px;
        }

        /* GALERÍA DE IMÁGENES */

        .galeria {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 35px auto;
        }

        .galeria img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border: 2px solid #f6d32d;
            border-radius: 8px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .galeria img:hover {
            transform: scale(1.04);
            box-shadow: 0 0 15px #f6d32d;
        }

        /* BOTONES */

        .botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 40px 0;
        }

        .boton {
            display: inline-block;
            background-color: #f6d32d;
            color: black;
            padding: 14px 35px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
            transition: all 0.3s;
        }

        .boton:hover {
            background-color: white;
            transform: translateY(-3px);
        }

        /* PIE DE PÁGINA */

        footer {
            background-color: #f6d32d;
            color: #000000;
            text-align: center;
            padding: 18px;
            font-size: 14px;
            font-weight: bold;
        }

        /* ADAPTACIÓN A MÓVILES */

        @media (max-width: 700px) {

            h1 {
                font-size: 32px;
            }

            h2 {
                font-size: 23px;
            }

            h3 {
                font-size: 16px;
            }

            .galeria img {
                width: 100%;
                max-width: 300px;
                height: 300px;
            }

            .botones {
                flex-direction: column;
                align-items: center;
            }

            .boton {
                width: 220px;
                text-align: center;
            }

        }

    </style>
</head>

<body>

    <!-- ENCABEZADO SIN MENÚ PAGOS -->

    <header>
    </header>

    <!-- CONTENIDO PRINCIPAL -->

    <main>

        <h1>XUSK2.0</h1>

        <h2>FAN ZONE</h2>

        <h3>
            En este espacio se colgarán las propuestas de asistencias
            a eventos, entradas para circuito, entradas a eventos tipo
            concentraciones y otras actividades relacionadas con el
            mundo del motociclismo.
        </h3>

        <!-- GALERÍA DE FOTOGRAFÍAS -->

        <div class="galeria">

            <img
                src="https://xusk21.wordpress.com/wp-content/uploads/2011/01/cheste_06_artur.jpg"
                alt="Evento de motociclismo en Cheste"
                loading="lazy">

            <img
                src="https://xusk21.wordpress.com/wp-content/uploads/2011/01/dh000046.jpg"
                alt="Concentración de motociclismo"
                loading="lazy">

            <img
                src="https://xusk21.wordpress.com/wp-content/uploads/2011/01/jerez_07_25.jpg"
                alt="Evento de motociclismo en Jerez"
                loading="lazy">

        </div>

        <!-- BOTONES DE ACCESO -->

        <div class="botones">

            <a class="boton"
               href="https://tickets.motogp.com/en/"
               target="_blank"
               rel="noopener noreferrer">
                ENTRADAS
            </a>

            <a class="boton" href="pagos.html">
                PAGOS
            </a>

        </div>

    </main>

    <!-- PIE DE PÁGINA -->

    <footer>
        <p>Página creada por XUSK2 © Noviembre 2026</p>
    </footer>

</body>

</html>
